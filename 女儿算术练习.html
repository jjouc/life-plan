<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小朋友算术练习 🌟</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%; overflow: hidden;
    font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
    background: #f0f9ff;
  }

  /* ══ 整体竖屏固定布局 ══ */
  #app {
    display: flex; flex-direction: column;
    height: 100dvh; /* dynamic viewport height for mobile */
    max-width: 480px; margin: 0 auto;
    position: relative;
  }

  /* ── 顶部信息栏 ── */
  #topbar {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px 4px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(6px);
    z-index: 10;
  }
  #topbar h1 { font-size: 1.1em; color: #ff6b9d; }
  #star-count { font-size: 1em; color: #7c4dff; font-weight: bold; }
  #history-btn {
    font-size: 0.78em; color: #aaa; border: none;
    background: none; cursor: pointer; text-decoration: underline dotted;
  }

  /* ── 模式选择 ── */
  #mode-bar {
    flex: 0 0 auto;
    display: flex; gap: 6px; padding: 5px 10px;
    overflow-x: auto; background: rgba(255,255,255,0.7);
    scrollbar-width: none;
  }
  #mode-bar::-webkit-scrollbar { display: none; }
  .mode-btn {
    flex: 0 0 auto;
    padding: 5px 13px; border-radius: 16px;
    border: 2px solid #ddd; background: white;
    color: #888; font-size: 0.82em; cursor: pointer; white-space: nowrap;
  }
  .mode-btn.active {
    background: linear-gradient(135deg, #ffaa33, #ff6b9d);
    color: white; border-color: transparent;
  }

  /* ── 拼图区 ── */
  #puzzle-wrap {
    flex: 0 0 auto;
    position: relative;
    margin: 6px 10px 0;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 3px 16px rgba(0,0,0,0.13);
    /* 高度由JS动态设定，约占屏幕22% */
  }
  #puzzle-scene {
    width: 100%; height: 100%;
    display: block;
  }
  #puzzle-overlay {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  /* 徽章小条 */
  #badge-bar {
    flex: 0 0 auto;
    display: flex; gap: 6px; padding: 4px 10px;
    overflow-x: auto; min-height: 36px;
    scrollbar-width: none; align-items: center;
  }
  #badge-bar::-webkit-scrollbar { display: none; }
  .badge-chip {
    flex: 0 0 auto;
    background: white; border-radius: 20px;
    padding: 3px 10px; font-size: 0.78em;
    box-shadow: 0 1px 6px rgba(0,0,0,0.1);
    white-space: nowrap; color: #666;
    animation: popIn 0.35s ease;
  }
  @keyframes popIn { 0%{transform:scale(0)}70%{transform:scale(1.12)}100%{transform:scale(1)} }

  /* ── 题目网格 ── */
  #grid-wrap {
    flex: 1 1 0; overflow: hidden;
    padding: 4px 8px 0;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px; height: 100%;
  }
  .card {
    background: white; border-radius: 14px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border: 3px solid #eee;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    cursor: pointer; transition: border-color 0.2s, background 0.2s;
    padding: 4px;
    gap: 2px;
  }
  .card.selected { border-color: #ffaa33; background: #fff9ee; }
  .card.correct  { border-color: #4caf50; background: #f0fff4; }
  .card.wrong    { border-color: #ff5252; background: #fff0f0; animation: shake 0.35s; }
  @keyframes shake {
    0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)}
  }
  .card-emoji  { font-size: 1.5em; line-height: 1; }
  .card-q      { font-size: 1.1em; font-weight: bold; color: #333; }
  .card-ans    {
    font-size: 1.3em; font-weight: bold;
    min-width: 40px; text-align: center;
    border-bottom: 2px solid #ddd;
    color: #7c4dff; min-height: 1.4em;
    line-height: 1.4;
  }
  .card.selected .card-ans { border-color: #ffaa33; }
  .card-fb     { font-size: 1em; min-height: 1.2em; }

  /* ── 底部固定区：结果 + 键盘 ── */
  #bottom-fixed {
    flex: 0 0 auto;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(8px);
    padding: 4px 8px 8px;
    border-top: 1px solid #eee;
  }

  /* 结果提示 */
  #result-row {
    text-align: center; font-size: 0.9em;
    color: #ff6b9d; font-weight: bold;
    min-height: 1.4em; margin-bottom: 4px;
  }

  /* 操作按钮 */
  #action-row {
    display: flex; gap: 8px; margin-bottom: 6px;
  }
  .act-btn {
    flex: 1; padding: 10px 0; border: none;
    border-radius: 20px; font-size: 0.9em;
    font-weight: bold; cursor: pointer;
  }
  .act-btn.check {
    background: linear-gradient(135deg, #ffaa33, #ff6b9d);
    color: white; box-shadow: 0 3px 10px rgba(255,107,157,0.35);
  }
  .act-btn.next {
    background: linear-gradient(135deg, #7c4dff, #40c4ff);
    color: white; box-shadow: 0 3px 10px rgba(124,77,255,0.3);
  }

  /* 数字键盘 */
  #numpad {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 5px;
  }
  .nk {
    background: #f3f3f3; border: none; border-radius: 10px;
    font-size: 1.3em; font-weight: bold; color: #333;
    padding: 10px 0; cursor: pointer;
    transition: background 0.1s, transform 0.08s;
    user-select: none;
  }
  .nk:active { background: #e0e0e0; transform: scale(0.93); }
  .nk.del { background: #ffe0e0; color: #ff5252; font-size: 1.1em; }
  .nk.zero { grid-column: span 2; }

  /* ══ 拼图遮罩块 ══ */
  .puzzle-tile {
    position: absolute;
    transition: opacity 0.5s ease, transform 0.5s ease;
    border-radius: 3px;
  }
  .puzzle-tile.revealed {
    opacity: 0 !important;
    transform: scale(1.08);
    pointer-events: none;
  }

  /* ══ 庆祝层 ══ */
  #celebrate-layer {
    position: fixed; inset: 0; z-index: 999;
    pointer-events: none; overflow: hidden;
  }
  .spark {
    position: absolute; width: 9px; height: 9px;
    border-radius: 50%;
    animation: burst 1.1s ease-out forwards;
  }
  @keyframes burst {
    0%  { transform:translate(0,0) scale(1); opacity:1; }
    100%{ transform:translate(var(--dx),var(--dy)) scale(0); opacity:0; }
  }
  .confetti-piece {
    position: absolute; width: 9px; height: 12px;
    border-radius: 2px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    0%  { transform:translateY(-20px) rotate(0deg); opacity:1; }
    100%{ transform:translateY(105vh)  rotate(720deg); opacity:0; }
  }
  #celebrate-msg {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%,-50%) scale(0);
    z-index: 1000; text-align: center;
    background: white; border-radius: 28px;
    padding: 28px 36px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    animation: msgPop 0.45s 0.2s ease forwards, msgFade 0.5s 3.2s ease forwards;
    pointer-events: none; display: none;
  }
  @keyframes msgPop  { to { transform:translate(-50%,-50%) scale(1); } }
  @keyframes msgFade { to { opacity:0; } }
  #celebrate-msg .big { font-size: 2.6em; }
  #celebrate-msg p    { font-size: 1.2em; color:#ff6b9d; font-weight:bold; margin-top:8px; }

  /* ══ 历史弹窗 ══ */
  #modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 2000;
    justify-content: center; align-items: center;
  }
  #modal-overlay.open { display: flex; }
  #modal-box {
    background: white; border-radius: 22px;
    padding: 24px 28px; width: 88%; max-width: 380px;
    box-shadow: 0 8px 36px rgba(0,0,0,0.16);
    max-height: 75vh; overflow-y: auto;
  }
  #modal-box h2 { color:#ff6b9d; margin-bottom:14px; font-size:1.1em; }
  .h-row {
    display:flex; justify-content:space-between;
    padding:7px 0; border-bottom:1px solid #f5f5f5;
    font-size:0.9em;
  }
  .h-row:last-child { border:none; }
  #modal-close {
    display:block; margin:16px auto 0;
    padding:8px 28px; border-radius:20px;
    border:none; background:linear-gradient(135deg,#ffaa33,#ff6b9d);
    color:white; font-size:0.95em; cursor:pointer; font-weight:bold;
  }
</style>
</head>
<body>
<div id="app">

  <!-- 顶部信息栏 -->
  <div id="topbar">
    <h1>🌈 小宝贝算术</h1>
    <span id="star-count">⭐ 今日：<b id="stars">0</b> 颗</span>
    <button id="history-btn" onclick="openHistory()">📅 历史</button>
  </div>

  <!-- 模式选择 -->
  <div id="mode-bar">
    <button class="mode-btn active" id="mode-add"   onclick="setMode('add')">➕ 10内加</button>
    <button class="mode-btn"        id="mode-sub"   onclick="setMode('sub')">➖ 10内减</button>
    <button class="mode-btn"        id="mode-mix"   onclick="setMode('mix')">🎲 10内混</button>
    <button class="mode-btn"        id="mode-add20" onclick="setMode('add20')">➕ 20内加</button>
    <button class="mode-btn"        id="mode-sub20" onclick="setMode('sub20')">➖ 20内减</button>
    <button class="mode-btn"        id="mode-mix20" onclick="setMode('mix20')">🎲 20内混</button>
  </div>

  <!-- 拼图区 -->
  <div id="puzzle-wrap">
    <svg id="puzzle-scene" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="puzzle-overlay"></div>
  </div>

  <!-- 徽章条 -->
  <div id="badge-bar"></div>

  <!-- 题目网格 -->
  <div id="grid-wrap">
    <div id="grid"></div>
  </div>

  <!-- 底部固定 -->
  <div id="bottom-fixed">
    <div id="result-row"></div>
    <div id="action-row">
      <button class="act-btn check" onclick="checkAll()">✅ 检查答案</button>
      <button class="act-btn next"  onclick="newGame()">🔄 换一组</button>
    </div>
    <div id="numpad">
      <button class="nk" onclick="numInput('1')">1</button>
      <button class="nk" onclick="numInput('2')">2</button>
      <button class="nk" onclick="numInput('3')">3</button>
      <button class="nk" onclick="numInput('4')">4</button>
      <button class="nk" onclick="numInput('5')">5</button>
      <button class="nk del" onclick="numDel()">⌫</button>
      <button class="nk" onclick="numInput('6')">6</button>
      <button class="nk" onclick="numInput('7')">7</button>
      <button class="nk" onclick="numInput('8')">8</button>
      <button class="nk" onclick="numInput('9')">9</button>
      <button class="nk zero" onclick="numInput('0')">0</button>
    </div>
  </div>
</div>

<!-- 庆祝层 -->
<div id="celebrate-layer"></div>
<div id="celebrate-msg"><div class="big">🎉🏆🎉</div><p>今天得了 50 颗星！<br>你是最棒的！</p></div>

<!-- 历史弹窗 -->
<div id="modal-overlay" onclick="closeHistoryOverlay(event)">
  <div id="modal-box">
    <h2>⭐ 星星历史</h2>
    <div id="history-list"></div>
    <button id="modal-close" onclick="closeHistoryBtn()">关闭</button>
  </div>
</div>

<script>
// ══════════════════════════════════════
// SVG 场景库 — 每天自动轮换
// ══════════════════════════════════════
const SCENES = [
  // 0 花园
  (w,h) => `
    <rect width="${w}" height="${h}" fill="#87CEEB"/>
    <ellipse cx="${w*0.5}" cy="${h*0.15}" rx="${w*0.35}" ry="${h*0.12}" fill="#fff" opacity="0.85"/>
    <ellipse cx="${w*0.25}" cy="${h*0.12}" rx="${w*0.22}" ry="${h*0.1}" fill="#fff" opacity="0.7"/>
    <rect x="0" y="${h*0.65}" width="${w}" height="${h*0.35}" fill="#5cb85c"/>
    <ellipse cx="${w*0.5}" cy="${h*0.65}" rx="${w*0.55}" ry="${h*0.08}" fill="#4cae4c"/>
    <!-- 大树 -->
    <rect x="${w*0.42}" y="${h*0.38}" width="${w*0.06}" height="${h*0.3}" fill="#8B5E3C"/>
    <ellipse cx="${w*0.45}" cy="${h*0.35}" rx="${w*0.14}" ry="${h*0.16}" fill="#2d8a2d"/>
    <ellipse cx="${w*0.38}" cy="${h*0.4}" rx="${w*0.1}" ry="${h*0.12}" fill="#34a834"/>
    <ellipse cx="${w*0.52}" cy="${h*0.39}" rx="${w*0.1}" ry="${h*0.12}" fill="#34a834"/>
    <!-- 花朵 -->
    <circle cx="${w*0.15}" cy="${h*0.63}" r="${w*0.04}" fill="#ff6b9d"/>
    <circle cx="${w*0.15}" cy="${h*0.56}" r="${w*0.025}" fill="#ffaa33"/>
    <rect x="${w*0.145}" y="${h*0.58}" width="${w*0.01}" height="${h*0.06}" fill="#4cae4c"/>
    <circle cx="${w*0.28}" cy="${h*0.61}" r="${w*0.035}" fill="#ff3399"/>
    <circle cx="${w*0.28}" cy="${h*0.555}" r="${w*0.022}" fill="#ffcc00"/>
    <rect x="${w*0.276}" y="${h*0.575}" width="${w*0.008}" height="${h*0.04}" fill="#4cae4c"/>
    <circle cx="${w*0.72}" cy="${h*0.62}" r="${w*0.04}" fill="#ff9500"/>
    <circle cx="${w*0.72}" cy="${h*0.555}" r="${w*0.025}" fill="#ff6b9d"/>
    <rect x="${w*0.716}" y="${h*0.577}" width="${w*0.008}" height="${h*0.047}" fill="#4cae4c"/>
    <circle cx="${w*0.85}" cy="${h*0.60}" r="${w*0.035}" fill="#7c4dff"/>
    <circle cx="${w*0.85}" cy="${h*0.545}" r="${w*0.022}" fill="#fff"/>
    <rect x="${w*0.846}" y="${h*0.563}" width="${w*0.008}" height="${h*0.04}" fill="#4cae4c"/>
    <!-- 蝴蝶 -->
    <ellipse cx="${w*0.65}" cy="${h*0.28}" rx="${w*0.04}" ry="${h*0.03}" fill="#ff6b9d" opacity="0.9" transform="rotate(-20,${w*0.65},${h*0.28})"/>
    <ellipse cx="${w*0.72}" cy="${h*0.27}" rx="${w*0.04}" ry="${h*0.03}" fill="#ffaa33" opacity="0.9" transform="rotate(20,${w*0.72},${h*0.27})"/>
    <ellipse cx="${w*0.685}" cy="${h*0.27}" rx="${w*0.007}" ry="${h*0.025}" fill="#333"/>
    <!-- 太阳 -->
    <circle cx="${w*0.88}" cy="${h*0.1}" r="${w*0.07}" fill="#FFD600"/>
    <circle cx="${w*0.88}" cy="${h*0.1}" r="${w*0.05}" fill="#FFEE58"/>
  `,
  // 1 海洋
  (w,h) => `
    <rect width="${w}" height="${h}" fill="#0288d1"/>
    <rect x="0" y="${h*0.45}" width="${w}" height="${h*0.55}" fill="#0077b6"/>
    <rect x="0" y="${h*0.5}" width="${w}" height="${h*0.5}" fill="#023e8a"/>
    <!-- 波浪 -->
    <path d="M0,${h*0.47} Q${w*0.15},${h*0.42} ${w*0.3},${h*0.47} Q${w*0.45},${h*0.52} ${w*0.6},${h*0.47} Q${w*0.75},${h*0.42} ${w},${h*0.47} L${w},${h*0.55} L0,${h*0.55}Z" fill="#0096c7" opacity="0.7"/>
    <!-- 鱼 -->
    <ellipse cx="${w*0.25}" cy="${h*0.62}" rx="${w*0.09}" ry="${h*0.045}" fill="#ff6b9d"/>
    <polygon points="${w*0.16},${h*0.62} ${w*0.12},${h*0.58} ${w*0.12},${h*0.66}" fill="#ff3399"/>
    <circle cx="${w*0.29}" cy="${h*0.61}" r="${w*0.012}" fill="white"/>
    <circle cx="${w*0.295}" cy="${h*0.61}" r="${w*0.007}" fill="#333"/>
    <ellipse cx="${w*0.65}" cy="${h*0.75}" rx="${w*0.07}" ry="${h*0.035}" fill="#ffaa33"/>
    <polygon points="${w*0.58},${h*0.75} ${w*0.54},${h*0.72} ${w*0.54},${h*0.78}" fill="#ff9500"/>
    <circle cx="${w*0.685}" cy="${h*0.745}" r="${w*0.01}" fill="white"/>
    <circle cx="${w*0.69}" cy="${h*0.745}" r="${w*0.006}" fill="#333"/>
    <!-- 海草 -->
    <path d="M${w*0.1},${h} Q${w*0.08},${h*0.82} ${w*0.12},${h*0.72} Q${w*0.16},${h*0.62} ${w*0.14},${h*0.55}" stroke="#00b894" stroke-width="${w*0.018}" fill="none" stroke-linecap="round"/>
    <path d="M${w*0.8},${h} Q${w*0.78},${h*0.85} ${w*0.82},${h*0.76}" stroke="#00b894" stroke-width="${w*0.015}" fill="none" stroke-linecap="round"/>
    <!-- 珊瑚 -->
    <circle cx="${w*0.45}" cy="${h*0.88}" r="${w*0.04}" fill="#ff6b9d" opacity="0.8"/>
    <circle cx="${w*0.42}" cy="${h*0.84}" r="${w*0.025}" fill="#ff3399" opacity="0.8"/>
    <circle cx="${w*0.48}" cy="${h*0.83}" r="${w*0.025}" fill="#ff9500" opacity="0.8"/>
    <!-- 云+太阳 -->
    <circle cx="${w*0.5}" cy="${h*0.1}" r="${w*0.065}" fill="#FFD600"/>
    <ellipse cx="${w*0.18}" cy="${h*0.18}" rx="${w*0.13}" ry="${h*0.07}" fill="white" opacity="0.9"/>
    <ellipse cx="${w*0.28}" cy="${h*0.15}" rx="${w*0.1}" ry="${h*0.065}" fill="white" opacity="0.9"/>
    <!-- 海鸥 -->
    <path d="M${w*0.6},${h*0.22} Q${w*0.63},${h*0.19} ${w*0.66},${h*0.22}" stroke="#555" stroke-width="2" fill="none"/>
    <path d="M${w*0.68},${h*0.2} Q${w*0.71},${h*0.17} ${w*0.74},${h*0.2}" stroke="#555" stroke-width="2" fill="none"/>
  `,
  // 2 太空
  (w,h) => `
    <rect width="${w}" height="${h}" fill="#0d0d2b"/>
    <!-- 星星 -->
    ${Array.from({length:40},(_,i)=>{
      const sx=Math.sin(i*137.5)*w, sy=Math.cos(i*97.3)*h;
      const px=((sx%w)+w)%w, py=((sy%h)+h)%h;
      const r=0.6+((i*7)%3)*0.5;
      return `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${r}" fill="white" opacity="${0.5+(i%5)*0.1}"/>`;
    }).join('')}
    <!-- 月亮 -->
    <circle cx="${w*0.82}" cy="${h*0.15}" r="${w*0.1}" fill="#fffde7"/>
    <circle cx="${w*0.88}" cy="${h*0.12}" r="${w*0.08}" fill="#0d0d2b"/>
    <!-- 行星 -->
    <circle cx="${w*0.22}" cy="${h*0.2}" r="${w*0.07}" fill="#7c4dff"/>
    <ellipse cx="${w*0.22}" cy="${h*0.2}" rx="${w*0.13}" ry="${h*0.025}" fill="none" stroke="#b39ddb" stroke-width="3" opacity="0.7"/>
    <!-- 火箭 -->
    <rect x="${w*0.44}" y="${h*0.35}" width="${w*0.08}" height="${h*0.18}" rx="4" fill="#e0e0e0"/>
    <polygon points="${w*0.44},${h*0.35} ${w*0.52},${h*0.35} ${w*0.48},${h*0.24}" fill="#ff5252"/>
    <rect x="${w*0.38}" y="${h*0.44}" width="${w*0.06}" height="${h*0.06}" rx="3" fill="#ff9500"/>
    <rect x="${w*0.52}" y="${h*0.44}" width="${w*0.06}" height="${h*0.06}" rx="3" fill="#ff9500"/>
    <circle cx="${w*0.48}" cy="${h*0.42}" r="${w*0.025}" fill="#40c4ff" opacity="0.9"/>
    <ellipse cx="${w*0.48}" cy="${h*0.55}" rx="${w*0.02}" ry="${h*0.04}" fill="#ff6b00" opacity="0.85"/>
    <!-- UFO -->
    <ellipse cx="${w*0.75}" cy="${h*0.55}" rx="${w*0.1}" ry="${h*0.04}" fill="#90caf9"/>
    <ellipse cx="${w*0.75}" cy="${h*0.52}" rx="${w*0.06}" ry="${h*0.04}" fill="#bbdefb"/>
    <ellipse cx="${w*0.75}" cy="${h*0.57}" rx="${w*0.1}" ry="${h*0.02}" fill="#64b5f6" opacity="0.5"/>
    <!-- 流星 -->
    <line x1="${w*0.1}" y1="${h*0.05}" x2="${w*0.25}" y2="${h*0.15}" stroke="white" stroke-width="2" opacity="0.7"/>
    <line x1="${w*0.55}" y1="${h*0.08}" x2="${w*0.65}" y2="${h*0.14}" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <!-- 地球 -->
    <circle cx="${w*0.2}" cy="${h*0.78}" r="${w*0.1}" fill="#1565c0"/>
    <ellipse cx="${w*0.18}" cy="${h*0.76}" rx="${w*0.05}" ry="${h*0.04}" fill="#2e7d32" opacity="0.9"/>
    <ellipse cx="${w*0.23}" cy="${h*0.8}" rx="${w*0.04}" ry="${h*0.03}" fill="#2e7d32" opacity="0.8"/>
  `,

// ══════════════════════════════════════
// 状态
// ══════════════════════════════════════
const COLS = 10, ROWS = 5, TOTAL_TILES = COLS * ROWS; // 50块
let questions = [], mode = 'add', selectedIdx = null;
let answers = Array(9).fill('');
let revealed = new Set(); // 已揭开的tile索引

// ── localStorage ──
const S = {
  today: () => new Date().toISOString().slice(0,10),
  getStars: () => { try{return JSON.parse(localStorage.getItem('math_stars')||'{}')}catch{return{}} },
  todayStars: () => S.getStars()[S.today()] || 0,
  addStars: n => {
    const d = S.getStars(), k = S.today();
    d[k] = (d[k]||0) + n;
    localStorage.setItem('math_stars', JSON.stringify(d));
    return d[k];
  },
  getBadges: () => { try{return JSON.parse(localStorage.getItem('math_badges')||'[]')}catch{return[]} },
  addBadge: b => { const a=S.getBadges(); a.push(b); localStorage.setItem('math_badges',JSON.stringify(a)); },
  hasBadgeToday: () => S.getBadges().some(b=>b.date===S.today()),
  // 拼图进度按日期存
  getPuzzle: () => { try{const d=JSON.parse(localStorage.getItem('math_puzzle')||'{}'); return d[S.today()]||[]}catch{return[]} },
  setPuzzle: arr => { const d={}; d[S.today()]=arr; localStorage.setItem('math_puzzle',JSON.stringify({...JSON.parse(localStorage.getItem('math_puzzle')||'{}'), ...d})); },
};

// ══════════════════════════════════════
// 拼图
// ══════════════════════════════════════
let puzzleW = 0, puzzleH = 0;

function initPuzzle() {
  const wrap = document.getElementById('puzzle-wrap');
  puzzleW = wrap.clientWidth;
  puzzleH = wrap.clientHeight;

  // 画场景
  const dayOfYear = Math.floor((new Date()-new Date(new Date().getFullYear(),0,0))/86400000);
  const sceneIdx = dayOfYear % SCENES.length;
  const svg = document.getElementById('puzzle-scene');
  svg.setAttribute('viewBox', `0 0 ${puzzleW} ${puzzleH}`);
  svg.setAttribute('width', puzzleW);
  svg.setAttribute('height', puzzleH);
  svg.innerHTML = SCENES[sceneIdx](puzzleW, puzzleH);

  // 建50块遮罩
  const overlay = document.getElementById('puzzle-overlay');
  overlay.innerHTML = '';
  const tw = puzzleW / COLS, th = puzzleH / ROWS;
  // 遮罩用柔和颜色，半透明，让人能约略感知下面有图
  const maskColors = ['#b2dfdb','#b3e5fc','#f8bbd0','#fff9c4','#e1bee7'];
  for (let i = 0; i < TOTAL_TILES; i++) {
    const col = i % COLS, row = Math.floor(i / COLS);
    const tile = document.createElement('div');
    tile.className = 'puzzle-tile';
    tile.id = 'tile-' + i;
    tile.style.cssText = `
      left:${col*tw}px; top:${row*th}px;
      width:${tw+0.5}px; height:${th+0.5}px;
      background:${maskColors[row % maskColors.length]};
      opacity:0.82;
    `;
    overlay.appendChild(tile);
  }

  // 恢复今日已揭开的块
  revealed = new Set(S.getPuzzle());
  revealed.forEach(i => {
    const el = document.getElementById('tile-' + i);
    if (el) { el.classList.add('revealed'); el.style.opacity = '0'; }
  });
}

function revealTiles(count) {
  // 随机揭开 count 块未揭开的
  const unrevealed = [];
  for (let i = 0; i < TOTAL_TILES; i++) {
    if (!revealed.has(i)) unrevealed.push(i);
  }
  // Fisher-Yates shuffle取前count个
  for (let i = unrevealed.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [unrevealed[i], unrevealed[j]] = [unrevealed[j], unrevealed[i]];
  }
  const toReveal = unrevealed.slice(0, Math.min(count, unrevealed.length));
  toReveal.forEach((idx, order) => {
    revealed.add(idx);
    setTimeout(() => {
      const el = document.getElementById('tile-' + idx);
      if (el) { el.classList.add('revealed'); el.style.opacity = '0'; }
    }, order * 80);
  });
  S.setPuzzle([...revealed]);

  // 全部揭完？
  if (revealed.size >= TOTAL_TILES) {
    setTimeout(puzzleComplete, toReveal.length * 80 + 300);
  }
}

function puzzleComplete() {
  celebrate('🎊 拼图完成啦！\n你太厉害了！');
}

// ══════════════════════════════════════
// 布局自适应
// ══════════════════════════════════════
function adjustLayout() {
  const appH = document.getElementById('app').clientHeight;
  // 拼图区高度：约22%
  const puzH = Math.round(appH * 0.22);
  document.getElementById('puzzle-wrap').style.height = puzH + 'px';
  initPuzzle();
}

// ══════════════════════════════════════
// 题目
// ══════════════════════════════════════
const emojis = ['🍎','🐱','🌸','🦋','🍓','⭐','🐸','🌈','🍉','🐠','🦄','🌻','🎀','🍦','🐼'];

function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

function makeQ() {
  const w20 = mode.endsWith('20');
  const isAdd = mode.startsWith('add') || (mode.includes('mix') && Math.random()>0.5);
  if (isAdd) {
    const a = randInt(1, w20?19:9);
    const b = randInt(1, Math.max(1, w20?(20-a):(10-a)));
    return {a,b,op:'+',ans:a+b};
  } else {
    const a = randInt(2, w20?20:10);
    const b = randInt(1, a-1);
    return {a,b,op:'-',ans:a-b};
  }
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('mode-'+m).classList.add('active');
  newGame();
}

function newGame() {
  questions = Array.from({length:9}, makeQ);
  answers = Array(9).fill('');
  selectedIdx = null;
  document.getElementById('result-row').textContent = '';
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  questions.forEach((q,i) => {
    const emoji = emojis[Math.floor(Math.random()*emojis.length)];
    const card = document.createElement('div');
    card.className = 'card' + (i===selectedIdx?' selected':'');
    card.id = 'card-'+i;
    card.onclick = () => selectCard(i);
    card.innerHTML = `
      <div class="card-emoji">${emoji}</div>
      <div class="card-q">${q.a} ${q.op} ${q.b} =</div>
      <div class="card-ans" id="ans-${i}">${answers[i]||'&nbsp;'}</div>
      <div class="card-fb" id="fb-${i}"></div>
    `;
    grid.appendChild(card);
  });
}

function selectCard(i) {
  selectedIdx = i;
  document.querySelectorAll('.card').forEach((c,j) => {
    c.classList.toggle('selected', j===i);
    c.classList.remove('correct','wrong');
  });
  document.getElementById('result-row').textContent = '';
}

// ── 数字键盘 ──
function numInput(d) {
  if (selectedIdx === null) {
    // 自动选第一个没填的
    const empty = answers.findIndex(a=>a==='');
    if (empty === -1) return;
    selectCard(empty);
  }
  const cur = answers[selectedIdx];
  const max = mode.endsWith('20') ? 20 : 10;
  const next = cur + d;
  if (parseInt(next) > max) return; // 超范围不填
  if (next.length > 2) return;
  answers[selectedIdx] = next;
  const el = document.getElementById('ans-'+selectedIdx);
  if (el) el.textContent = next;
}

function numDel() {
  if (selectedIdx === null) return;
  answers[selectedIdx] = answers[selectedIdx].slice(0,-1);
  const el = document.getElementById('ans-'+selectedIdx);
  if (el) el.textContent = answers[selectedIdx] || ' ';
}

// ── 检查 ──
function checkAll() {
  const allFilled = answers.every(a=>a!=='');
  if (!allFilled) {
    document.getElementById('result-row').textContent = '还有题目没填哦 😊';
    // 跳到第一个空题
    const empty = answers.findIndex(a=>a==='');
    selectCard(empty);
    return;
  }

  let correct = 0;
  questions.forEach((q,i) => {
    const card = document.getElementById('card-'+i);
    const fb   = document.getElementById('fb-'+i);
    if (parseInt(answers[i]) === q.ans) {
      card.classList.add('correct'); card.classList.remove('wrong','selected');
      fb.textContent = '🎉';
      correct++;
    } else {
      card.classList.add('wrong'); card.classList.remove('correct','selected');
      fb.textContent = '💭';
    }
  });
  selectedIdx = null;

  // 星星
  const total = S.addStars(correct);
  document.getElementById('stars').textContent = total;

  // 揭拼图
  if (correct > 0) revealTiles(correct);

  // 徽章
  if (total >= 50 && !S.hasBadgeToday()) {
    const icons  = ['🏆','🥇','🎖️','👑','🌟','🎉','💎','🦄'];
    const labels = ['今日50星','算术达人','超级棒棒','星星冠军','数学天才','每日冠军','钻石宝宝','独角兽奖'];
    const idx = S.getBadges().length % icons.length;
    const badge = { icon:icons[idx], label:labels[idx], date:S.today() };
    S.addBadge(badge);
    renderBadges();
    celebrate('🎉🏆🎉\n今天得了 50 颗星！\n你是最棒的！');
  }

  const banner = document.getElementById('result-row');
  if (correct===9)      banner.textContent = '🏆 全对！你是小天才！';
  else if(correct>=6)   banner.textContent = `✨ 答对 ${correct} 题！非常棒！`;
  else                  banner.textContent = `💪 答对 ${correct} 题！继续加油！`;
}

// ── 渲染徽章 ──
function renderBadges() {
  const bar = document.getElementById('badge-bar');
  bar.innerHTML = '';
  S.getBadges().forEach(b => {
    const chip = document.createElement('div');
    chip.className = 'badge-chip';
    chip.textContent = `${b.icon} ${b.label} ${b.date}`;
    bar.appendChild(chip);
  });
}

// ── 庆祝 ──
function celebrate(msg) {
  const layer = document.getElementById('celebrate-layer');
  layer.innerHTML = '';
  const colors = ['#ff6b9d','#ffaa33','#7c4dff','#40c4ff','#4caf50','#ff5252','#ffd600'];

  for (let b=0; b<6; b++) {
    const cx = 15+Math.random()*70+'vw', cy = 20+Math.random()*60+'vh';
    setTimeout(()=>{
      for(let s=0;s<18;s++){
        const spark=document.createElement('div');
        spark.className='spark';
        const angle=(s/18)*Math.PI*2, dist=70+Math.random()*100;
        spark.style.cssText=`left:${cx};top:${cy};background:${colors[s%colors.length]};--dx:${Math.cos(angle)*dist}px;--dy:${Math.sin(angle)*dist}px;animation-duration:${0.8+Math.random()*0.5}s`;
        layer.appendChild(spark);
      }
    }, b*200);
  }
  for(let i=0;i<50;i++){
    setTimeout(()=>{
      const c=document.createElement('div');
      c.className='confetti-piece';
      c.style.cssText=`left:${Math.random()*100}vw;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*0.4}s`;
      layer.appendChild(c);
    }, i*25);
  }

  const el = document.getElementById('celebrate-msg');
  el.querySelector('p').textContent = msg;
  el.style.display = 'block';
  el.style.animation = 'none';
  el.offsetHeight; // reflow
  el.style.animation = 'msgPop 0.45s 0.2s ease forwards, msgFade 0.5s 3.2s ease forwards';
  setTimeout(()=>{ el.style.display='none'; layer.innerHTML=''; }, 4000);
}

// ── 历史 ──
function openHistory() {
  const data = S.getStars();
  const list = document.getElementById('history-list');
  list.innerHTML = '';
  const keys = Object.keys(data).sort().reverse();
  if(!keys.length) {
    list.innerHTML = '<div style="color:#bbb;text-align:center;padding:12px">还没有记录哦</div>';
  } else {
    keys.forEach(d=>{
      const row=document.createElement('div');
      row.className='h-row';
      const hasBadge=S.getBadges().some(b=>b.date===d);
      row.innerHTML=`<span>${d}</span><span>${data[d]} 颗星 ${hasBadge?'🏆':''}</span>`;
      list.appendChild(row);
    });
  }
  document.getElementById('modal-overlay').classList.add('open');
}
function closeHistoryOverlay(e){ if(e.target.id==='modal-overlay') closeHistoryBtn(); }
function closeHistoryBtn(){ document.getElementById('modal-overlay').classList.remove('open'); }

// ── 启动 ──
window.addEventListener('load', ()=>{
  adjustLayout();
  document.getElementById('stars').textContent = S.todayStars();
  renderBadges();
  newGame();
});
window.addEventListener('resize', adjustLayout);
</script>
