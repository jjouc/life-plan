const REPO = 'jjouc/life-plan';
const DATA_FILE = 'data.json';

// ── 加密工具 ──────────────────────────────────────────────
async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

async function encrypt(text, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv   = crypto.getRandomValues(new Uint8Array(12));
  const key  = await deriveKey(password, salt);
  const enc  = new TextEncoder();
  const cipherBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(text));
  const result = { salt: bufToB64(salt), iv: bufToB64(iv), data: bufToB64(new Uint8Array(cipherBuf)) };
  return JSON.stringify(result);
}

async function decrypt(cipherJson, password) {
  const { salt, iv, data } = JSON.parse(cipherJson);
  const key = await deriveKey(password, b64ToBuf(salt));
  const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBuf(iv) }, key, b64ToBuf(data));
  return new TextDecoder().decode(plainBuf);
}

function bufToB64(buf) { return btoa(String.fromCharCode(...buf)); }
function b64ToBuf(b64) { return Uint8Array.from(atob(b64), c => c.charCodeAt(0)); }

// ── Token 管理（加密后存 localStorage）────────────────────
async function getToken(password) {
  const enc = localStorage.getItem('life_plan_token_enc');
  if (!enc) return '';
  try { return await decrypt(enc, password); } catch { return ''; }
}

async function saveToken(token, password) {
  const enc = await encrypt(token, password);
  localStorage.setItem('life_plan_token_enc', enc);
}

// ── 密码界面 ──────────────────────────────────────────────
let _password = null;

function showPasswordScreen() {
  document.body.innerHTML = `

      <div style="background:white;border-radius:20px;padding:40px 36px;width:360px;max-width:90vw;box-shadow:0 8px 40px rgba(0,0,0,0.12);text-align:center">

        <input id="pwd-input" type="password" placeholder="输入密码…"
          style="width:100%;border:1px solid #e0e0e0;border-radius:10px;padding:12px 16px;font-size:16px;outline:none;text-align:center;margin-bottom:12px"
          onkeydown="if(event.key==='Enter')submitPassword()">
        <button onclick="submitPassword()"
          style="width:100%;background:#007aff;color:white;border:none;border-radius:10px;padding:13px;font-size:16px;font-weight:600;cursor:pointer">
          进入
        </button>
        <p id="pwd-error" style="color:#ff3b30;font-size:13px;margin-top:10px;min-height:18px"></p>
      </div>
    </div>`;
  setTimeout(() => document.getElementById('pwd-input').focus(), 100);
}

async function submitPassword() {
  const pwd = document.getElementById('pwd-input').value;
  if (!pwd) return;
  document.querySelector('button[onclick="submitPassword()"]').textContent = '验证中…';

  // 尝试用该密码解密已有数据来验证密码是否正确
  const hasData = localStorage.getItem('life_plan_token_enc') || await checkGitHubEncrypted(pwd);
  if (hasData === false) {
    // 首次使用，任何密码都接受（作为设置新密码）
    _password = pwd;
    initApp();
    return;
  }
  if (hasData === 'wrong') {
    document.getElementById('pwd-error').textContent = '密码不对，请重试';
    document.querySelector('button[onclick="submitPassword()"]').textContent = '进入';
    document.getElementById('pwd-input').value = '';
    document.getElementById('pwd-input').focus();
    return;
  }
  _password = pwd;
  initApp();
}

async function checkGitHubEncrypted(pwd) {
  try {
    const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${DATA_FILE}`, {
      headers: { 'Accept': 'application/vnd.github.v3+json' }
    });
    if (!res.ok) return false; // 文件不存在，首次使用
    const json = await res.json();
    const raw = atob(json.content.replace(/\n/g, ''));
    // 检查是否是加密格式（有 salt/iv/data 字段）
    let parsed;
    try { parsed = JSON.parse(raw); } catch { return false; }
    if (!parsed.salt) return false; // 旧的未加密格式，当首次使用处理
    // 尝试解密验证密码
    try { await decrypt(raw, pwd); return true; }
    catch { return 'wrong'; }
  } catch { return false; }
}

  { id: null, cat: '自己', text: '老公随口插嘴孩子学习时，不接话不怼，就说"好，我来安排"然后结束', done: false, quadrant: 'q2' },

async function loadData() {
  try {
    const token = await getToken(_password);
    const headers = { 'Accept': 'application/vnd.github.v3+json' };
    if (token) headers['Authorization'] = `token ${token}`;
    const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${DATA_FILE}`, { headers });
    if (res.ok) {
      const json = await res.json();
      const raw = atob(json.content.replace(/\n/g, ''));
      let data;
      try {
        const parsed = JSON.parse(raw);
        if (parsed.salt) {
          // 加密格式，解密
          const plain = await decrypt(raw, _password);
          data = JSON.parse(plain);
        } else {
          // 旧的未加密格式，直接用
          data = parsed;
        }
      } catch {
        initFromDefault();
        renderAll();
        return;
      }
      cards = data.cards;
      nextId = data.nextId || (Math.max(...cards.map(c => c.id)) + 1);
    } else {
      initFromDefault();
    }
  } catch(e) {
    initFromDefault();
  }
  renderAll();
}

function initFromDefault() {
  cards = INITIAL_CARDS.map((c, i) => ({ ...c, id: i + 1 }));
  nextId = cards.length + 1;
}

function renderAll() {
  ['q1','q2','q3','q4'].forEach(q => {
    document.getElementById('cards-' + q).innerHTML = '';
  });
  cards.forEach(card => renderCard(card));
}

function renderCard(card) {
  const container = document.getElementById('cards-' + card.quadrant);
  if (!container) return;

  const div = document.createElement('div');
  div.className = `card cat-${card.cat}${card.done ? ' done' : ''}${(!showDone && card.done) ? ' hidden' : ''}`;
  div.id = 'card-' + card.id;
  div.draggable = true;
  div.addEventListener('dragstart', e => onDragStart(e, card.id));
  div.addEventListener('dragend', onDragEnd);

  div.innerHTML = `
    <div class="card-top">
      <input type="checkbox" class="card-check" ${card.done ? 'checked' : ''} onchange="toggleCard(${card.id})">
      <div class="card-text" contenteditable="true" onblur="editCard(${card.id}, this.innerText)">${escHtml(card.text)}</div>
      <span class="card-tag tag-${card.cat}">${card.cat}</span>
    </div>
    <div class="card-actions">
      <button class="card-btn delete" onclick="deleteCard(${card.id})">删除</button>
    </div>
  `;
  container.appendChild(div);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toggleCard(id) {
  const card = cards.find(c => c.id === id);
  if (!card) return;
  card.done = !card.done;
  const el = document.getElementById('card-' + id);
  el.classList.toggle('done', card.done);
  if (!showDone && card.done) el.classList.add('hidden');
  setStatus('未保存');
}

function editCard(id, text) {
  const card = cards.find(c => c.id === id);
  if (!card) return;
  card.text = text.trim();
  setStatus('未保存');
}

function deleteCard(id) {
  if (!confirm('确定删除这张卡片吗？')) return;
  cards = cards.filter(c => c.id !== id);
  const el = document.getElementById('card-' + id);
  if (el) el.remove();
  setStatus('未保存');
}

function addCard() {
  const text = document.getElementById('new-text').value.trim();
  const cat = document.getElementById('new-cat').value;
  const quadrant = document.getElementById('new-quadrant').value;
  if (!text) return;
  const card = { id: nextId++, cat, text, done: false, quadrant };
  cards.push(card);
  renderCard(card);
  document.getElementById('new-text').value = '';
  setStatus('未保存');
}

function toggleDone() {
  showDone = !showDone;
  document.getElementById('toggle-done-btn').textContent = showDone ? '隐藏已完成' : '显示已完成';
  document.querySelectorAll('.card.done').forEach(el => {
    el.classList.toggle('hidden', !showDone);
  });
}

// 拖拽
function onDragStart(e, id) {
  draggingId = id;
  setTimeout(() => {
    const el = document.getElementById('card-' + id);
    if (el) el.classList.add('dragging');
  }, 0);
}

function onDragEnd() {
  if (draggingId) {
    const el = document.getElementById('card-' + draggingId);
    if (el) el.classList.remove('dragging');
  }
  draggingId = null;
  document.querySelectorAll('.quadrant').forEach(q => q.classList.remove('drag-over'));
}

function onDragOver(e) {
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
}

function onDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}

function onDrop(e, quadrant) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (!draggingId) return;
  const card = cards.find(c => c.id === draggingId);
  if (!card || card.quadrant === quadrant) return;
  card.quadrant = quadrant;
  const el = document.getElementById('card-' + draggingId);
  if (el) el.remove();
  renderCard(card);
  setStatus('未保存');
}

async function saveToGitHub() {
  let token = await getToken(_password);
  if (!token) {
    const t = prompt('请输入 GitHub Personal Access Token（将加密后存在本地）：');
    if (!t || !t.trim()) { setStatus('需要 Token 才能保存'); return; }
    token = t.trim();
    await saveToken(token, _password);
  }

  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  setStatus('保存中...');

  const plain = JSON.stringify({ cards, nextId }, null, 2);
  const cipherJson = await encrypt(plain, _password);
  const content = btoa(unescape(encodeURIComponent(cipherJson)));
  const authHeaders = {
    'Authorization': `token ${token}`,
    'Accept': 'application/vnd.github.v3+json',
    'Content-Type': 'application/json'
  };

  try {
    let sha = null;
    const getRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${DATA_FILE}`, {
      headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
    });
    if (getRes.ok) {
      const json = await getRes.json();
      sha = json.sha;
    }

    const body = { message: '更新人生计划', content };
    if (sha) body.sha = sha;

    const putRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${DATA_FILE}`, {
      method: 'PUT',
      headers: authHeaders,
      body: JSON.stringify(body)
    });

    if (putRes.ok) {
      setStatus('已保存 ✓ ' + new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}));
    } else {
      const err = await putRes.json();
      if (err.message && err.message.includes('Bad credentials')) {
        localStorage.removeItem('life_plan_token_enc');
        setStatus('Token 无效，请重新保存时输入');
      } else {
        setStatus('保存失败：' + (err.message || putRes.status));
      }
    }
  } catch(e) {
    setStatus('保存失败：' + e.message);
  }
  btn.disabled = false;
}

function setStatus(msg) {
  document.getElementById('save-status').textContent = msg;
}
